global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs: [{ targets: ['alertmanager:9093'] }]
scrape_configs:
  - job_name: edge
    static_configs: [{ targets: ['edge:8081'] }]       # /metrics on the private listener
  - job_name: workflow
    static_configs: [{ targets: ['workflow:8080'] }]
  - job_name: adapters
    static_configs: [{ targets: ['adapters:8080'] }]
