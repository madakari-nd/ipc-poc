openapi: 3.1.0
info:
  title: IPC Programme POC API
  version: 1.0.0
  summary: Programme Edge public API (/ipc/v1) and private workflow API (/internal) for the IPC programme on ELEVATE.
  description: |
    Contract-first definition (Constitution Principle V) for the IPC Programme POC.

    * **Public** operations live under `/ipc/v1` on the Programme Edge, the only public entry point
      (Caddy TLS :443). Root `/healthz`, `/readyz`, `/dependencies` are the Edge's own health routes.
    * **Private** operations live under `/internal` on the workflow service, reachable only on the
      private compose network. They are tagged `internal` and are never routed by the Edge (US9 AS7).
      The Edge forwards governance calls to workflow with the same request/response shapes, carrying
      the acting user in a service JWT; those mirrored routes are not repeated here.

    Conventions (details in `contracts/README.md`):
    * Browser writes: session cookie `ipc_sid` (httpOnly, Secure, SameSite=Strict) **and** `X-CSRF-Token`.
    * Every write (POST/PUT/PATCH/DELETE) carries `Idempotency-Key` (UUID, kept 7 days per user). A replay
      returns the stored response with `Idempotent-Replayed: true`; the same key with a different body is
      refused with 422 `IDEMPOTENCY_KEY_REUSED`. `login` is the only exception (no user yet).
    * Writes on versioned resources carry `If-Match: "<v>"`. A stale `v` gets 409 `VERSION_CONFLICT`
      whose body carries the current resource (`current`) for the differences view (FR-016).
    * Errors are RFC 9457 `application/problem+json` with a stable `code` and `correlationId`.
    * Scope is always derived on the server; any scope, facility or role claimed in a request body is
      ignored (FR-028). 403 policy: a resource outside the caller's scope (or an id that does not
      exist) returns 403 `SCOPE_DENIED`, so existence is not disclosed; a resource in scope where the
      caller is not the owner or assignee the operation requires returns 403 `NOT_OWNER`. Both are
      written to the ledger.
    * Free text is at most 500 characters. Lists are cursor-paginated (`limit` 1-100, default 25).
    * No patient data field exists anywhere in this contract (FR-032).

    Extensions: `x-roles` lists the roles allowed (scope still applies); `x-requirements` lists the
    FR/US ids the operation serves.
  license:
    name: Proprietary (POC)
    identifier: LicenseRef-Proprietary
servers:
  - url: https://ipc.localhost
    description: Programme Edge (public, TLS). Serves /ipc/v1 and the Edge health routes.
  - url: http://workflow:8080
    description: IPC workflow service (private network only). Serves /internal.
security:
  - sessionCookie: []
tags:
  - name: auth
    description: Sign-in through ELEVATE's own login, session and current user.
  - name: home
    description: Role home ("what needs me now").
  - name: admin
    description: Programme setup - programme, cycles, imports, scopes, risk defaults, escalation rules.
  - name: catalogue
    description: Checklist catalogue (versions are immutable once published).
  - name: demo
    description: Demo clock and on-demand sweep (demo mode only).
  - name: assessments
    description: Ward assessments, form bundles, submission, baseline, release, comparison and trend.
  - name: evidence
    description: Evidence locker (MinIO) - intents, confirmation, short-lived links, patient-media deletion.
  - name: plans
    description: Improvement plans, approval and revisions.
  - name: tasks
    description: Task state machine, decisions and history.
  - name: escalations
    description: Escalation records and manual escalation.
  - name: support
    description: Expert support requests with ELEVATE mentoring.
  - name: oversight
    description: District and state oversight read models.
  - name: notifications
    description: In-app notifications and SMS consent.
  - name: devices
    description: Field-device queue status telemetry.
  - name: ledger
    description: Tamper-evident audit ledger.
  - name: health
    description: Liveness, readiness and dependency status.
  - name: internal
    description: Private workflow API - reachable only on the private network, never through the Edge.

paths:
  # ---------------------------------------------------------------- auth
  /ipc/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with ELEVATE identifier and password
      description: |
        Calls ELEVATE user-service login, stores ELEVATE tokens encrypted server-side and sets the
        `ipc_sid` cookie. Password login only in the POC (OTP is a pilot upgrade). Exempt from
        Idempotency-Key and CSRF (no session yet).
      security: []
      x-roles: [PUBLIC]
      x-requirements: [FR-033, FR-034, US9]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Signed in; session cookie set.
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetSessionCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /ipc/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session and revoke ELEVATE tokens
      security:
        - sessionCookie: []
          csrfToken: []
      x-roles: [ANY_AUTHENTICATED]
      x-requirements: [FR-033]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Session ended; cookie cleared.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /ipc/v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current user, roles, server-derived scope and CSRF token
      x-roles: [ANY_AUTHENTICATED]
      x-requirements: [FR-003, FR-028, FR-033, FR-035, FR-036, US9]
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /ipc/v1/me/home:
    get:
      tags: [home]
      operationId: getHome
      summary: What needs me now (role home)
      description: Cards limited to actions the active role may take, counted within the server-derived scope.
      x-roles: [STATE_ADMIN, DISTRICT_QM, IPC_OFFICER, WARD_SUPERVISOR, FRONTLINE, MENTOR, EXTERNAL_AUDITOR]
      x-requirements: [FR-036, US1, US2, US3, US4, US5, US6, US7, US8]
      responses:
        '200':
          description: Home cards.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HomeSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /ipc/v1/me/sms-consent:
    put:
      tags: [notifications]
      operationId: setSmsConsent
      summary: Give or withdraw consent for the SMS stand-in channel
      security:
        - sessionCookie: []
          csrfToken: []
      x-roles: [ANY_AUTHENTICATED]
      x-requirements: [FR-021, US5]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SmsConsentRequest'}
      responses:
        '200':
          description: Consent recorded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SmsConsent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /ipc/v1/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: People picker - users in scope (for owners, mentors' proposed owners, scopes)
      x-roles: [STATE_ADMIN, DISTRICT_QM, IPC_OFFICER, WARD_SUPERVISOR]
      x-requirements: [FR-003, FR-012, FR-013, US3, US4]
      parameters:
        - {name: wardId, in: query, schema: {$ref: '#/components/schemas/ObjectId'}}
        - {name: facilityId, in: query, schema: {$ref: '#/components/schemas/ObjectId'}}
        - {name: role, in: query, schema: {$ref: '#/components/schemas/Role'}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Users in scope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/UserSummary'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ---------------------------------------------------------------- admin
  /ipc/v1/admin/programme:
    get:
      tags: [admin]
      operationId: getProgramme
      summary: Programme settings
      x-roles: [STATE_ADMIN]
      x-requirements: [FR-001, FR-035, US1]
      responses:
        '200':
          description: Programme.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Programme'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    patch:
      tags: [admin]
      operationId: updateProgramme
      summary: Update programme name or languages
      security:
        - sessionCookie: []
          csrfToken: []
      x-roles: [STATE_ADMIN]
      x-requirements: [FR-001, FR-031, FR-035, US1]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProgrammeUpdate'}
      responses:
        '200':
          description: Updated programme.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Programme'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /ipc/v1/facilities:
    get:
      tags: [admin]
      operationId: listFacilities
      summary: Hierarchy - districts, hospitals and their ward register (scoped)
      x-roles: [STATE_ADMIN, DISTRICT_QM, IPC_OFFICER, WARD_SUPERVISOR, MENTOR, EXTERNAL_AUDITOR]
      x-requirements: [FR-001, FR-018a, FR-028, US1, US6, US9]
      parameters:
        - {name: districtCode, in: query, schema: {type: string, maxLength: 32}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/FacilityStatus'}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Facilities with wards, limited to scope (a mentor sees only facilities with an accepted support request).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/Facility'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /ipc/v1/cycles:
    get:
      tags: [admin]
      operationId: listCycles
      summary: Assessment cycles
      x-roles: [ANY_AUTHENTICATED]
      x-requirements: [FR-004, US1, US7]
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/CycleStatus'}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cycles.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/Cycle'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /ipc/v1/admin/cycles:
    post:
      tags: [admin]
      operationId: createCycle
      summary: Create an assessment cycle with target dates
      security:
        - sessionCookie: []
          csrfToken: []
      x-roles: [STATE_ADMIN]
      x-requirements: [FR-004, FR-018a, FR-031, US1]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CycleCreate'}
      responses:
        '201':
          description: Cycle created.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cycle'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /ipc/v1/admin/cycles/{cycleId}:
    parameters:
      - $ref: '#/components/parameters/CycleId'
    patch:
      tags: [admin]
      operationId: updateCycle
      summary: Update cycle dates or status (planned, active, closed)
      security:
        - sessionCookie: []
          csrfToken: []
      x-roles: [STATE_ADMIN]
      x-requirements: [FR-004, FR-031, US1]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CycleUpdate'}
      responses:
        '200':
          description: Updated cycle.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cycle'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /ipc/v1/admin/imports:
    post:
      tags: [admin]
      operationId: createImport
      summary: Upload a facility-master or staff (HR) file for import into ELEVATE
      description: |
        Starts an asynchronous import job run by the adapters service. Facility rows create or update
        ELEVATE entities (facility code = externalId) and the ward register; HR rows create or update
        ELEVATE users and programme scopes, and users marked as left are deactivated, their scope ends
        and their open tasks appear in the supervisor's "needs reassignment" view.
      security:
        - sessionCookie: []
          csrfToken: []
      x-roles: [STATE_ADMIN]
      x-requirements: [FR-001, FR-002, FR-003, FR-031, US1]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: '#/components/schemas/ImportUpload'}
      responses:
        '202':
          description: Import job accepted.
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /ipc/v1/admin/imports/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [admin]
      operationId: getImport
      summary: Import job status, counts and row errors
      x-roles: [STATE_ADMIN]
      x-requirements: [FR-002, US1]
      responses:
        '200':
          description: Import job.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /ipc/v1/admin/scope-assignments:
    get:
      tags: [admin]
      operationId: listScopeAssignments
      summary: Role and scope assignments
      x-roles: [STATE_ADMIN]
      x-requirements: [FR-003, US1, US9]
      parameters:
        - {name: userId, in: query, schema: {$ref: '#/components/schemas/UserId'}}
        - {name: role, in: query, schema: {$ref: '#/components/schemas/Role'}}
        - {name: activeOn, in: query, description: Only assignments valid at this instant., schema: {type: string, format: date-time}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Assignments.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/ScopeAssignment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      tags: [admin]
      operationId: createScopeAssignment
      summary: Assign a role and scope with validity dates
      security:
        - sessionCookie: []
          csrfToken: []
      x-roles: [STATE_ADMIN]
      x-requirements: [FR-003, FR-028, FR-031, US1, US9]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScopeAssignmentCreate'}
      responses:
        '201':
          description: Assignment created (ledger `scope.changed`).
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScopeAssignment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /ipc/v1/admin/scope-assignments/{assignmentId}:
    parameters:
      - $ref: '#/components/parameters/AssignmentId'
    patch:
      tags: [admin]
      operationId: updateScopeAssignment
      summary: Change or end a scope assignment
      security:
        - sessionCookie: []
          csrfToken: []
      x-roles: [STATE_ADMIN]
      x-requirements: [FR-003, FR-031, US1]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScopeAssignmentUpdate'}
      responses:
        '200':
          description: Updated assignment.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScopeAssignment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ---------------------------------------------------------------- catalogue
  /ipc/v1/checklists:
    get:
      tags: [catalogue]
      operationId: listChecklistVersions
      summary: Checklist versions (draft versions visible to STATE_ADMIN only)
      x-roles: [ANY_AUTHENTICATED]
      x-requirements: [FR-005, US1]
      parameters:
        - {name: checklistCode, in: query, schema: {type: string, maxLength: 32}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/ChecklistStatus'}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Versions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/ChecklistVersion'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /ipc/v1/checklists/{checklistVersionId}:
    parameters:
      - $ref: '#/components/parameters/ChecklistVersionId'
    get:
      tags: [catalogue]
      operationId: getChecklistVersion
      summary: One checklist version with sections and questions (readable forever, also when retired)
      x-roles: [ANY_AUTHENTICATED]
      x-requirements: [FR-005, US1, US7]
      responses:
        '200':
          description: Checklist version.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChecklistVersion'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /ipc/v1/admin/checklists:
    post:
      tags: [catalogue]
      operationId: createChecklistDraft
      summary: Create a draft checklist version (optionally based on a published version)
      security:
        - sessionCookie: []
          csrfToken: []
      x-roles: [STATE_ADMIN]
      x-requirements: [FR-005, FR-006, FR-031, US1]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChecklistDraftCreate'}
      responses:
        '201':
          description: Draft created with the next version number.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChecklistVersion'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /ipc/v1/admin/checklists/{checklistVersionId}:
    parameters:
      - $ref: '#/components/parameters/ChecklistVersionId'
    patch:
      tags: [catalogue]
      operationId: updateChecklistDraft
      summary: Edit a draft checklist version (published or retired versions are refused)
