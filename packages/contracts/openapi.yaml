  /readyz:
    get:
      tags: [health]
      operationId: edgeReadyz
      summary: Edge readiness (own stores only; an ELEVATE outage does not fail readiness)
      security: []
      x-roles: [PUBLIC]
      x-requirements: [FR-034]
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /dependencies:
    get:
      tags: [health]
      operationId: edgeDependencies
      summary: Status of ELEVATE services and stores, used to say which function is unavailable
      x-roles: [ANY_AUTHENTICATED]
      x-requirements: [FR-036]
      responses:
        '200':
          description: Dependency report.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DependencyReport'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ---------------------------------------------------------------- internal (private network)
  /internal/scopes/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/UserId'}
    get:
      tags: [internal]
      operationId: internalGetEffectiveScope
      summary: Effective scope assignments for a user (Edge caches 60 s)
      security:
        - serviceJwt: []
      x-roles: [SERVICE]
      x-requirements: [FR-003, FR-028, US9]
      responses:
        '200':
          description: Active assignments.
          content:
            application/json:
              schema:
                type: object
                required: [userId, assignments, resolvedAt]
                properties:
                  userId: {$ref: '#/components/schemas/UserId'}
                  resolvedAt: {$ref: '#/components/schemas/Timestamp'}
                  mentorFacilityIds:
                    type: array
                    description: For MENTOR, facilities with an accepted support request.
                    items: {$ref: '#/components/schemas/ObjectId'}
                  assignments:
                    type: array
                    items: {$ref: '#/components/schemas/ScopeAssignment'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /internal/escalations/sweep:
    post:
      tags: [internal]
      operationId: internalEscalationSweep
      summary: Hourly escalation sweep called by the ELEVATE scheduler
      description: Authenticated by the static `X-Scheduler-Secret` header (security case V2). Idempotent on (task, rule, level).
      security:
        - schedulerSecret: []
      x-roles: [SCHEDULER]
      x-requirements: [FR-020, FR-021, FR-027, FR-034, US5, US9]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                jobRunId: {type: string, maxLength: 64}
      responses:
        '200':
          description: Sweep result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SweepResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /internal/escalations/run-now:
    post:
      tags: [internal]
      operationId: internalEscalationRunNow
      summary: Run the sweep now (demo mode; forwarded by the Edge for STATE_ADMIN)
      security:
        - serviceJwt: []
      x-roles: [SERVICE]
      x-requirements: [FR-020, FR-038, US5]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Sweep result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SweepResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /internal/reconciliation/run:
    post:
      tags: [internal]
      operationId: internalRunReconciliation
      summary: One-way reconciliation of programme task state into ELEVATE project-service
      description: Every correction is written to the ledger (`reconcile.corrected`). Normally runs on a timer.
      security:
        - serviceJwt: []
      x-roles: [SERVICE]
      x-requirements: [FR-018a, FR-019, FR-031]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                planIds:
                  type: array
                  maxItems: 100
                  items: {$ref: '#/components/schemas/ObjectId'}
      responses:
        '200':
          description: Reconciliation result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReconciliationResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /internal/ledger/records:
    post:
      tags: [internal]
      operationId: internalAppendLedger
      summary: Append a ledger record on behalf of the Edge
      description: |
        Used by the Edge for events it decides itself: access denials (`evidence.denied`,
        `scope.denied`, `owner.denied`), evidence actions (`evidence.confirmed`,
        `evidence.patient_data_deleted`) and refused checklist-edit attempts. Workflow assigns `seq`,
        `at`, `programmeAt`, `prevHash` and `hash` in the same transaction as the append.
      security:
        - serviceJwt: []
      x-roles: [SERVICE]
      x-requirements: [FR-031, FR-032, US9]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LedgerAppendRequest'}
      responses:
        '201':
          description: Record appended.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LedgerRecord'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /internal/assessments/{elevateSubmissionId}/context:
    parameters:
      - name: elevateSubmissionId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ElevateRef'}
    put:
      tags: [internal]
      operationId: internalUpsertAssessmentContext
      summary: Create or update the programme AssessmentContext for an ELEVATE submission
      description: |
        Called by the Edge after it writes a submission to samiksha (start, submit). Keyed on
        `elevateSubmissionId` (unique). Server-derived fields (`isBaselineForCycle`, `baselineOfId`,
        `releaseState`, `scores`, `failedQuestionKeys`) are set by workflow, not by the caller. Status
        only moves forward (draft → submitted → completed); a regression returns 409 `INVALID_TRANSITION`.
      security:
        - serviceJwt: []
      x-roles: [SERVICE]
      x-requirements: [FR-010, FR-032, US2]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssessmentContextUpsert'}
      responses:
        '200':
          description: Updated.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssessmentContext'}
        '201':
          description: Created.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssessmentContext'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /internal/evidence/data-quality:
    servers:
      - url: http://edge:8081
        description: Edge private listener (private network only; not exposed on the public :443 entry point).
    get:
      tags: [internal]
      operationId: edgeInternalEvidenceDQ
      summary: Evidence-based data-quality exceptions (served by the Edge, which owns evidence)
      description: |
        **Served by the Edge** on its private listener, not by workflow; workflow merges these with its
        own exceptions (no baseline, stale device queue) for `listDataQualityExceptions`. Returns the
        evidence-based kinds: `PHOTO_NO_GPS`, `GPS_FAR_FROM_FACILITY` (> 1 km from the facility point),
        `DEVICE_CLOCK_SKEW` (> 10 min), `LATE_UPLOAD` (capture to upload > 7 days) and
        `DUPLICATE_PHOTO_ACROSS_WARDS` (same SHA-256 in two wards).
      security:
        - serviceJwt: []
      x-roles: [SERVICE]
      x-requirements: [FR-026, US8]
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [PHOTO_NO_GPS, GPS_FAR_FROM_FACILITY, DEVICE_CLOCK_SKEW, LATE_UPLOAD, DUPLICATE_PHOTO_ACROSS_WARDS]
        - {name: facilityId, in: query, schema: {$ref: '#/components/schemas/ObjectId'}}
        - {name: wardId, in: query, schema: {$ref: '#/components/schemas/ObjectId'}}
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Exceptions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/DataQualityException'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /internal/healthz:
    get:
      tags: [internal, health]
      operationId: workflowHealthz
      summary: Workflow liveness
      security: []
      x-roles: [PUBLIC]
      x-requirements: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /internal/readyz:
    get:
      tags: [internal, health]
      operationId: workflowReadyz
      summary: Workflow readiness (Mongo and Kafka only)
      security: []
      x-roles: [PUBLIC]
      x-requirements: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /internal/dependencies:
    get:
      tags: [internal, health]
      operationId: workflowDependencies
      summary: Workflow view of ELEVATE dependencies (display and alerts)
      security:
        - serviceJwt: []
      x-roles: [SERVICE]
      x-requirements: []
      responses:
        '200':
          description: Dependency report.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DependencyReport'}
        '401': {$ref: '#/components/responses/Unauthorized'}

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ipc_sid
      description: httpOnly, Secure, SameSite=Strict session cookie set by login. Idle timeout 30 min (officer web); field device session up to 7 days with refresh.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit token from `GET /ipc/v1/me` or the login response. Required on every browser write.
    serviceJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived service JWT (edge→workflow, adapters→workflow) carrying `sub` (service) and `act` (acting user id and role).
    schedulerSecret:
      type: apiKey
      in: header
      name: X-Scheduler-Secret
      description: Static secret configured in the ELEVATE scheduler job; only for the escalation sweep.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID, stored with user, method, path and request hash for 7 days. Replays return the stored response.
      schema: {type: string, format: uuid}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The resource version `v` the write was built on, as a strong ETag, e.g. `"7"`.
      schema: {type: string, pattern: '^"[0-9]+"$'}
      example: '"7"'
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `nextCursor`.
      schema: {type: string, maxLength: 512}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    CycleId:
      name: cycleId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ObjectId'}
    JobId:
      name: jobId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ObjectId'}
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ObjectId'}
    ChecklistVersionId:
      name: checklistVersionId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ObjectId'}
    RuleCode:
      name: ruleCode
      in: path
      required: true
      schema: {$ref: '#/components/schemas/RuleCode'}
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ObjectId'}
    WardId:
      name: wardId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ObjectId'}
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ObjectId'}
    PlanId:
      name: planId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ObjectId'}
    TaskId:
      name: taskId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ObjectId'}
    SupportRequestId:
      name: supportRequestId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ObjectId'}
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ObjectId'}

  headers:
    ETag:
      description: Current resource version `v` as a strong ETag, e.g. `"8"`.
      schema: {type: string, pattern: '^"[0-9]+"$'}
    Location:
      description: URL of the created resource or job.
      schema: {type: string, format: uri-reference}
    SetSessionCookie:
      description: '`ipc_sid=<opaque>; HttpOnly; Secure; SameSite=Strict; Path=/`'
      schema: {type: string}
    RetryAfter:
      description: Seconds until the client may retry.
      schema: {type: integer, minimum: 1}
    CorrelationId:
      description: Correlation id of the request (echoed or generated); also in the problem body.
      schema: {type: string, maxLength: 64}

  responses:
    TaskOk:
      description: Transition applied; task returned with new `v`.
      headers:
        ETag: {$ref: '#/components/headers/ETag'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Task'}
    BadRequest:
      description: Malformed request, missing Idempotency-Key or If-Match (`VALIDATION_FAILED`, `IDEMPOTENCY_KEY_REQUIRED`, `IF_MATCH_REQUIRED`).
      headers:
        X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: No valid session, service token or scheduler secret (`UNAUTHENTICATED`, `SESSION_EXPIRED`).
      headers:
        X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Role, scope, ownership, CSRF or demo-mode refusal. `SCOPE_DENIED` = resource outside the caller's scope (or unknown id); `NOT_OWNER` = in scope but the caller is not the required owner or assignee; also `ROLE_DENIED`, `CSRF_INVALID`, `DEMO_MODE_DISABLED`. Recorded in the ledger.
      headers:
        X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Unknown route or catalogue item (`NOT_FOUND`). Scoped resources answer 403 instead.
      headers:
        X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: |
        `VERSION_CONFLICT` (body carries `current` and `currentVersion` for the differences view),
        `CHECKLIST_PUBLISHED`, `INVALID_TRANSITION`, `DEPENDENCY_OPEN` (with `blockingTasks`) or
        `IDEMPOTENCY_KEY_IN_PROGRESS`.
      headers:
        X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ConflictProblem'}
    Unprocessable:
      description: Semantically invalid (`VALIDATION_FAILED`, `IDEMPOTENCY_KEY_REUSED`, `DECLARATION_REQUIRED`, `EVIDENCE_RULE_NOT_MET`, `EVIDENCE_HASH_MISMATCH`, `CHECKLIST_VERSION_RETIRED`).
      headers:
        X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TooManyRequests:
      description: Per-user rate limit exceeded (default 120 requests/minute) - `RATE_LIMITED`.
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
        X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ServiceUnavailable:
      description: ELEVATE or storage unavailable (`ELEVATE_UNAVAILABLE`, `STORAGE_UNAVAILABLE`); nothing was half-written. Clients retry later.
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
        X-Correlation-Id: {$ref: '#/components/headers/CorrelationId'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    # ---------- primitives
    ObjectId:
      type: string
      pattern: '^[a-f0-9]{24}$'
    UserId:
      type: string
      description: ELEVATE user id.
      maxLength: 64
    ElevateRef:
      type: string
      description: Opaque ELEVATE identifier.
      maxLength: 64
    Timestamp:
      type: string
      format: date-time
    Sha256:
      type: string
      pattern: '^[a-f0-9]{64}$'
    FreeText:
      type: string
      maxLength: 500
    Role:
      type: string
      enum: [STATE_ADMIN, DISTRICT_QM, IPC_OFFICER, WARD_SUPERVISOR, FRONTLINE, MENTOR, EXTERNAL_AUDITOR]
    ScopeLevel:
      type: string
      enum: [state, district, facility, wards, own_tasks]
    Language:
      type: string
      enum: [en, hi, kn]
    Profile:
      type: string
      enum: [dev, test, uat, prod]
    LocalizedText:
      type: object
      required: [en]
      additionalProperties: false
      properties:
        en: {type: string, maxLength: 500}
        hi: {type: string, maxLength: 500}
        kn: {type: string, maxLength: 500}
    RiskLevel:
      type: string
      enum: [critical, high, normal]
    TaskState:
      type: string
      enum: [ASSIGNED, IN_PROGRESS, EVIDENCE_SUBMITTED, CHANGES_REQUESTED, VERIFIED, PENDING_VALIDATION, CLOSED]
    Channel:
      type: string
      enum: [inapp, email, sms]
    FacilityStatus:
      type: string
      enum: [active, inactive]
    CycleStatus:
      type: string
      enum: [planned, active, closed]
    ChecklistStatus:
      type: string
      enum: [draft, published, retired]
    AssessmentStatus:
      type: string
      enum: [draft, submitted, completed]
    ReleaseState:
      type: string
      enum: [n/a, held, released]
    PlanStatus:
      type: string
      enum: [draft, active, closed]
    SupportRequestStatus:
      type: string
      enum: [open, requested, accepted, rejected, held, closed]
    Skill:
      type: string
      enum: [hand_hygiene, ppe, waste, cleaning, device_bundles, sterilisation]
    RuleCode:
      type: string
      pattern: '^R[0-9]{1,3}$'
    DecisionKind:
      type: string
      enum: [accept, return, validate, validation_return]
    DecisionReasonCode:
      type: string
      description: Programme reason list (seeded; FR-014).
      enum: [MEETS_STANDARD, MEETS_STANDARD_WITH_NOTE, EVIDENCE_UNCLEAR, EVIDENCE_INCOMPLETE, WRONG_LOCATION_OR_ITEM, STANDARD_NOT_MET, PATIENT_DATA_VISIBLE, OTHER]
    LedgerSubjectType:
      type: string
      enum: [programme, facility, ward, cycle, scope_assignment, checklist_version, risk_default, escalation_rule, assessment, evidence, plan, task, escalation, support_request, clock, import_job, retention_policy]
    DataQualityExceptionKind:
      type: string
      enum: [PHOTO_NO_GPS, GPS_FAR_FROM_FACILITY, DEVICE_CLOCK_SKEW, LATE_UPLOAD, DUPLICATE_PHOTO_ACROSS_WARDS, NO_BASELINE, STALE_DEVICE_QUEUE]
    ResourceMeta:
      type: object
      required: [id, v, createdAt, updatedAt]
      properties:
        id: {$ref: '#/components/schemas/ObjectId'}
        v: {type: integer, minimum: 0, description: Version used for If-Match.}
        createdAt: {$ref: '#/components/schemas/Timestamp'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
    Page:
      type: object
      required: [nextCursor]
      properties:
        nextCursor:
          type: [string, 'null']
          description: Null on the last page.
    Actor:
      type: object
      required: [userId, role]
      additionalProperties: false
      properties:
        userId: {type: string, maxLength: 64, description: ELEVATE user id or `system`.}
        role:
          type: string
          enum: [STATE_ADMIN, DISTRICT_QM, IPC_OFFICER, WARD_SUPERVISOR, FRONTLINE, MENTOR, EXTERNAL_AUDITOR, SYSTEM]

    # ---------- errors
    ProblemCode:
      type: string
      enum:
        - UNAUTHENTICATED
        - SESSION_EXPIRED
        - CSRF_INVALID
        - ROLE_DENIED
        - SCOPE_DENIED
        - NOT_OWNER
        - NOT_FOUND
        - VALIDATION_FAILED
        - IDEMPOTENCY_KEY_REQUIRED
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_KEY_IN_PROGRESS
        - IF_MATCH_REQUIRED
        - VERSION_CONFLICT
        - CHECKLIST_PUBLISHED
        - CHECKLIST_VERSION_RETIRED
        - INVALID_TRANSITION
        - DEPENDENCY_OPEN
        - DECLARATION_REQUIRED
        - EVIDENCE_RULE_NOT_MET
        - EVIDENCE_HASH_MISMATCH
        - RATE_LIMITED
        - ELEVATE_UNAVAILABLE
        - STORAGE_UNAVAILABLE
        - DEMO_MODE_DISABLED
        - INTERNAL_ERROR
    Problem:
      type: object
      description: RFC 9457 problem details. Extension members are allowed.
      required: [type, title, status, code, correlationId]
      properties:
        type: {type: string, format: uri-reference, example: 'https://ipc.localhost/problems/version-conflict'}
        title: {type: string, maxLength: 200}
        status: {type: integer, minimum: 400, maximum: 599}
        code: {$ref: '#/components/schemas/ProblemCode'}
        detail: {type: string, maxLength: 1000}
        instance: {type: string, format: uri-reference}
        correlationId: {type: string, maxLength: 64}
        errors:
          type: array
          description: Field-level errors for VALIDATION_FAILED.
          items:
            type: object
            required: [path, message]
            properties:
              path: {type: string, maxLength: 200}
              message: {type: string, maxLength: 300}
        unavailable:
          type: array
          description: Functions unavailable for ELEVATE_UNAVAILABLE / STORAGE_UNAVAILABLE.
          items: {type: string, maxLength: 64}
    ConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            currentVersion: {type: integer, minimum: 0}
            current:
              description: The current resource (for VERSION_CONFLICT) so the client can show differences.
              anyOf:
                - $ref: '#/components/schemas/Task'
                - $ref: '#/components/schemas/PlanDetail'
                - $ref: '#/components/schemas/AssessmentContext'
                - $ref: '#/components/schemas/ChecklistVersion'
                - $ref: '#/components/schemas/SupportRequest'
                - $ref: '#/components/schemas/EvidenceItem'
                - type: object
            blockingTasks:
              type: array
              description: For DEPENDENCY_OPEN.
              items:
                type: object
                required: [id, title, state]
                properties:
                  id: {$ref: '#/components/schemas/ObjectId'}
                  title: {$ref: '#/components/schemas/LocalizedText'}
                  state: {$ref: '#/components/schemas/TaskState'}

    # ---------- auth
    LoginRequest:
      type: object
      required: [identifier, password, client]
      additionalProperties: false
      properties:
        identifier: {type: string, maxLength: 254, description: ELEVATE email or phone.}
        password: {type: string, maxLength: 256, writeOnly: true}
        client: {type: string, enum: [web, field]}
        deviceId: {type: string, format: uuid}
    Session:
      type: object
      required: [user, csrfToken, expiresAt]
      properties:
        user: {$ref: '#/components/schemas/Me'}
        csrfToken: {type: string, maxLength: 128}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
    Me:
      type: object
      required: [userId, name, assignments, activeRole, preferredLanguage, demoMode]
      properties:
        userId: {$ref: '#/components/schemas/UserId'}
        name: {type: string, maxLength: 200}
        activeRole: {$ref: '#/components/schemas/Role'}
        assignments:
          type: array
          items: {$ref: '#/components/schemas/ScopeAssignment'}
        preferredLanguage: {$ref: '#/components/schemas/Language'}
        csrfToken: {type: string, maxLength: 128}
        sessionExpiresAt: {$ref: '#/components/schemas/Timestamp'}
        smsConsent: {$ref: '#/components/schemas/SmsConsent'}
        demoMode: {type: boolean}
        profile: {$ref: '#/components/schemas/Profile'}
    UserSummary:
      type: object
      required: [userId, name, roles, active]
      properties:
        userId: {$ref: '#/components/schemas/UserId'}
        name: {type: string, maxLength: 200}
        roles:
          type: array
          items: {$ref: '#/components/schemas/Role'}
        wardIds:
          type: array
          items: {$ref: '#/components/schemas/ObjectId'}
        active: {type: boolean}
    SmsConsentRequest:
      type: object
      required: [given]
      additionalProperties: false
      properties:
        given: {type: boolean}
        source: {type: string, enum: [field_app, officer_web], default: officer_web}
    SmsConsent:
      type: object
      required: [given, at, source]
      properties:
        given: {type: boolean}
        at: {$ref: '#/components/schemas/Timestamp'}
        source: {type: string, maxLength: 32}

    # ---------- home
    HomeSummary:
      type: object
      required: [role, programmeNow, cards]
      properties:
        role: {$ref: '#/components/schemas/Role'}
        programmeNow: {$ref: '#/components/schemas/Timestamp'}
        cards:
          type: array
          items:
            type: object
            required: [kind, count]
            properties:
              kind:
                type: string
                enum: [assessments_due, draft_plans, my_tasks, review_queue, validation_queue, needs_reassignment, overdue_critical, escalations, support_requests, held_results, unread_notifications, stale_devices, data_quality_exceptions, checklist_drafts, import_jobs]
              count: {type: integer, minimum: 0}
              href: {type: string, format: uri-reference, description: The list operation that backs the card.}
              preview:
                type: array
                maxItems: 5
                items:
                  type: object
                  required: [id, label]
                  properties:
                    id: {type: string, maxLength: 64}
                    label: {type: string, maxLength: 200}
                    dueAt: {$ref: '#/components/schemas/Timestamp'}
                    riskLevel: {$ref: '#/components/schemas/RiskLevel'}

    # ---------- reference
    Programme:
      allOf:
        - $ref: '#/components/schemas/ResourceMeta'
        - type: object
          required: [code, name, stateEntityId, elevateOrgId, profile, languages]
          properties:
            code: {type: string, pattern: '^[A-Z0-9-]{2,32}$'}
            name: {type: string, maxLength: 200}
            stateEntityId: {$ref: '#/components/schemas/ElevateRef'}
            elevateOrgId: {$ref: '#/components/schemas/ElevateRef'}
            profile: {$ref: '#/components/schemas/Profile'}
            languages:
              type: array
              items: {$ref: '#/components/schemas/Language'}
            demoMode: {type: boolean}
    ProgrammeUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, maxLength: 200}
        languages:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Language'}
    GeoPoint:
      type: object
      required: [lat, lng]
      additionalProperties: false
      properties:
        lat: {type: number, minimum: -90, maximum: 90}
        lng: {type: number, minimum: -180, maximum: 180}
    Ward:
      allOf:
        - $ref: '#/components/schemas/ResourceMeta'
        - type: object
          required: [facilityId, wardCode, elevateEntityId, name, wardType, active]
          properties:
            facilityId: {$ref: '#/components/schemas/ObjectId'}
            wardCode: {type: string, maxLength: 32}
            elevateEntityId: {$ref: '#/components/schemas/ElevateRef'}
            name: {type: string, maxLength: 200}
            wardType: {type: string, maxLength: 32, examples: [ICU, general, OT, labour]}
            active: {type: boolean}
            serviceAccountUserId: {$ref: '#/components/schemas/UserId'}
    Facility:
      allOf:
        - $ref: '#/components/schemas/ResourceMeta'
        - type: object
          required: [facilityCode, elevateEntityId, name, districtCode, level, location, status]
          properties:
            facilityCode: {type: string, maxLength: 64}
            elevateEntityId: {$ref: '#/components/schemas/ElevateRef'}
            name: {type: string, maxLength: 200}
            districtCode: {type: string, maxLength: 32}
            level: {type: string, enum: [district, sub-district, community]}
            location: {$ref: '#/components/schemas/GeoPoint'}
            status: {$ref: '#/components/schemas/FacilityStatus'}
            wards:
              type: array
              items: {$ref: '#/components/schemas/Ward'}
    Cycle:
      allOf:
        - $ref: '#/components/schemas/ResourceMeta'
        - type: object
          required: [code, startsAt, endsAt, targetDates, status]
          properties:
            code: {type: string, pattern: '^[0-9]{4}-C[0-9]+$'}
            startsAt: {$ref: '#/components/schemas/Timestamp'}
            endsAt: {$ref: '#/components/schemas/Timestamp'}
            targetDates:
              type: object
              required: [baselineBy]
              properties:
                baselineBy: {$ref: '#/components/schemas/Timestamp'}
                repeatBy: {$ref: '#/components/schemas/Timestamp'}
            elevateSolutionIds:
              type: object
              properties:
                plan: {$ref: '#/components/schemas/ElevateRef'}
                observation: {$ref: '#/components/schemas/ElevateRef'}
            status: {$ref: '#/components/schemas/CycleStatus'}
    CycleCreate:
      type: object
      required: [code, startsAt, endsAt, targetDates]
      additionalProperties: false
      properties:
        code: {type: string, pattern: '^[0-9]{4}-C[0-9]+$'}
        startsAt: {$ref: '#/components/schemas/Timestamp'}
        endsAt: {$ref: '#/components/schemas/Timestamp'}
        targetDates:
          type: object
          required: [baselineBy]
          additionalProperties: false
          properties:
            baselineBy: {$ref: '#/components/schemas/Timestamp'}
            repeatBy: {$ref: '#/components/schemas/Timestamp'}
    CycleUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        startsAt: {$ref: '#/components/schemas/Timestamp'}
        endsAt: {$ref: '#/components/schemas/Timestamp'}
        targetDates:
          type: object
          additionalProperties: false
          properties:
            baselineBy: {$ref: '#/components/schemas/Timestamp'}
            repeatBy: {$ref: '#/components/schemas/Timestamp'}
        status: {$ref: '#/components/schemas/CycleStatus'}
    ImportUpload:
      type: object
      required: [kind, file]
      properties:
        kind: {type: string, enum: [facility, hr]}
        file:
          type: string
          contentMediaType: text/csv
          description: CSV, at most 5 MB. Facility rows carry facility code, district, level, location and wards; HR rows carry staff id, name, contact, role, facility/ward codes, status (active or left). No patient data.
        dryRun: {type: boolean, default: false}
    ImportJob:
      allOf:
        - $ref: '#/components/schemas/ResourceMeta'
        - type: object
          required: [kind, status, fileSha256, counts]
          properties:
            kind: {type: string, enum: [facility, hr]}
            status: {type: string, enum: [queued, running, succeeded, partially_succeeded, failed]}
            dryRun: {type: boolean}
            fileSha256: {$ref: '#/components/schemas/Sha256'}
            counts:
              type: object
              required: [rows, created, updated, deactivated, failed]
              properties:
                rows: {type: integer, minimum: 0}
                created: {type: integer, minimum: 0}
                updated: {type: integer, minimum: 0}
                deactivated: {type: integer, minimum: 0}
                failed: {type: integer, minimum: 0}
                tasksNeedingReassignment: {type: integer, minimum: 0}
            rowErrors:
              type: array
              maxItems: 1000
              items:
                type: object
                required: [row, code, message]
                properties:
                  row: {type: integer, minimum: 1}
                  code: {type: string, maxLength: 64}
                  message: {type: string, maxLength: 300}
            substitutions:
              type: array
              description: ELEVATE capability substitutions used (e.g. per-record API instead of bulk upload).
              items: {type: string, maxLength: 300}
            startedAt: {$ref: '#/components/schemas/Timestamp'}
            finishedAt: {$ref: '#/components/schemas/Timestamp'}
    Scope:
      type: object
      required: [level]
      additionalProperties: false
      properties:
        level: {$ref: '#/components/schemas/ScopeLevel'}
        districtCode: {type: string, maxLength: 32}
        facilityId: {$ref: '#/components/schemas/ObjectId'}
        facilityIds:
          type: array
          description: EXTERNAL_AUDITOR facility list.
          items: {$ref: '#/components/schemas/ObjectId'}
        wardIds:
          type: array
          items: {$ref: '#/components/schemas/ObjectId'}
    ScopeAssignment:
      allOf:
        - $ref: '#/components/schemas/ResourceMeta'
        - type: object
          required: [userId, role, scope, validFrom, source]
          properties:
            userId: {$ref: '#/components/schemas/UserId'}
            role: {$ref: '#/components/schemas/Role'}
            scope: {$ref: '#/components/schemas/Scope'}
            validFrom: {$ref: '#/components/schemas/Timestamp'}
            validTo: {$ref: '#/components/schemas/Timestamp'}
            source: {type: string, enum: [hr_import, admin]}
    ScopeAssignmentCreate:
      type: object
      required: [userId, role, scope, validFrom]
      additionalProperties: false
      description: Scope level must fit the role (data-model §1); otherwise 422 VALIDATION_FAILED.
      properties:
        userId: {$ref: '#/components/schemas/UserId'}
        role: {$ref: '#/components/schemas/Role'}
        scope: {$ref: '#/components/schemas/Scope'}
        validFrom: {$ref: '#/components/schemas/Timestamp'}
        validTo: {$ref: '#/components/schemas/Timestamp'}
        reason: {$ref: '#/components/schemas/FreeText'}
    ScopeAssignmentUpdate:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        scope: {$ref: '#/components/schemas/Scope'}
        validTo: {$ref: '#/components/schemas/Timestamp'}
        reason: {$ref: '#/components/schemas/FreeText'}

    # ---------- catalogue & rules
    EvidenceRule:
      type: object
      required: [photoRequired, minPhotos]
      additionalProperties: false
      properties:
        photoRequired: {type: boolean}
        minPhotos: {type: integer, minimum: 0, maximum: 10}
    ChecklistSection:
      type: object
      required: [sectionKey, title, wardTypes]
      additionalProperties: false
      properties:
        sectionKey: {type: string, pattern: '^[a-z0-9_]{1,40}$'}
        title: {$ref: '#/components/schemas/LocalizedText'}
        wardTypes:
          type: array
          description: Ward types the section applies to (empty = all).
          items: {type: string, maxLength: 32}
    ChecklistQuestion:
      type: object
      required: [questionKey, sectionKey, text, riskLevel, passMark, maxScore]
      additionalProperties: false
      properties:
        questionKey: {type: string, pattern: '^[A-Z0-9_.-]{1,40}$', description: Stable programme key across versions.}
        elevateQuestionExternalId: {type: string, maxLength: 64}
        sectionKey: {type: string, pattern: '^[a-z0-9_]{1,40}$'}
        text: {$ref: '#/components/schemas/LocalizedText'}
        textHash: {$ref: '#/components/schemas/Sha256'}
        answerType: {type: string, enum: [score, yes_no, single_choice], default: score}
        options:
          type: array
          items:
            type: object
            required: [value, label, score]
            properties:
              value: {type: string, maxLength: 32}
              label: {$ref: '#/components/schemas/LocalizedText'}
              score: {type: number}
        riskLevel: {$ref: '#/components/schemas/RiskLevel'}
        passMark: {type: number, minimum: 0}
        maxScore: {type: number, minimum: 0}
        templateTaskKey: {type: string, maxLength: 40}
    PlanTemplateTask:
      type: object
      required: [templateTaskKey, title]
      additionalProperties: false
      properties:
        templateTaskKey: {type: string, maxLength: 40}
        title: {$ref: '#/components/schemas/LocalizedText'}
        description: {$ref: '#/components/schemas/LocalizedText'}
    ChecklistVersion:
      allOf:
        - $ref: '#/components/schemas/ResourceMeta'
        - type: object
          required: [checklistCode, version, status, sections, questions]
          properties:
            checklistCode: {type: string, maxLength: 32}
            version: {type: integer, minimum: 1}
            status: {$ref: '#/components/schemas/ChecklistStatus'}
            elevateSolutionId: {$ref: '#/components/schemas/ElevateRef'}
            elevateObservationTemplateId: {$ref: '#/components/schemas/ElevateRef'}
            publishedAt: {$ref: '#/components/schemas/Timestamp'}
            graceUntil: {$ref: '#/components/schemas/Timestamp'}
            contentHash: {$ref: '#/components/schemas/Sha256'}
            planTemplate:
              type: object
              required: [version]
              properties:
                elevateTemplateId: {$ref: '#/components/schemas/ElevateRef'}
                version: {type: integer, minimum: 1}
                tasks:
                  type: array
                  items: {$ref: '#/components/schemas/PlanTemplateTask'}
            sections:
              type: array
              items: {$ref: '#/components/schemas/ChecklistSection'}
            questions:
              type: array
              items: {$ref: '#/components/schemas/ChecklistQuestion'}
    ChecklistDraftCreate:
      type: object
      required: [checklistCode]
      additionalProperties: false
      properties:
        checklistCode: {type: string, maxLength: 32}
        basedOnVersionId: {$ref: '#/components/schemas/ObjectId'}
        sections:
          type: array
          items: {$ref: '#/components/schemas/ChecklistSection'}
        questions:
          type: array
          items: {$ref: '#/components/schemas/ChecklistQuestion'}
        planTemplateTasks:
          type: array
          items: {$ref: '#/components/schemas/PlanTemplateTask'}
    ChecklistDraftUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        sections:
          type: array
          items: {$ref: '#/components/schemas/ChecklistSection'}
        questions:
          type: array
          items: {$ref: '#/components/schemas/ChecklistQuestion'}
        planTemplateTasks:
          type: array
          items: {$ref: '#/components/schemas/PlanTemplateTask'}
    RiskDefault:
      allOf:
        - $ref: '#/components/schemas/ResourceMeta'
        - type: object
          required: [riskLevel, dueDays, evidenceRule, secondValidation]
          properties:
            riskLevel: {$ref: '#/components/schemas/RiskLevel'}
            dueDays: {type: integer, minimum: 1, maximum: 365}
            evidenceRule: {$ref: '#/components/schemas/EvidenceRule'}
            secondValidation: {type: boolean}
    RiskDefaultUpdate:
      type: object
      required: [dueDays, evidenceRule, secondValidation]
      additionalProperties: false
      properties:
        dueDays: {type: integer, minimum: 1, maximum: 365}
        evidenceRule: {$ref: '#/components/schemas/EvidenceRule'}
        secondValidation: {type: boolean}
        reason: {$ref: '#/components/schemas/FreeText'}
    RetentionPolicy:
      type: object
      required: [evidenceYearsAfterPlanClosure, auditYears, otherYearsAfterProgrammeEnd, purgeMode, v, updatedAt]
      properties:
        evidenceYearsAfterPlanClosure: {type: integer, minimum: 1, maximum: 50, default: 3}
        auditYears: {type: integer, minimum: 1, maximum: 50, default: 7}
        otherYearsAfterProgrammeEnd: {type: integer, minimum: 1, maximum: 50, default: 5}
        purgeMode: {type: string, enum: [dry_run, enforce], default: dry_run, description: The POC uses dry_run.}
        updatedBy: {$ref: '#/components/schemas/UserId'}
        updatedAt: {$ref: '#/components/schemas/Timestamp'}
        v: {type: integer, minimum: 0}
    RetentionPolicyUpdate:
      type: object
      required: [evidenceYearsAfterPlanClosure, auditYears, otherYearsAfterProgrammeEnd, purgeMode]
      additionalProperties: false
      properties:
        evidenceYearsAfterPlanClosure: {type: integer, minimum: 1, maximum: 50}
        auditYears: {type: integer, minimum: 1, maximum: 50}
        otherYearsAfterProgrammeEnd: {type: integer, minimum: 1, maximum: 50}
        purgeMode: {type: string, enum: [dry_run, enforce]}
        reason: {$ref: '#/components/schemas/FreeText'}
    EscalationCondition:
      type: object
      required: [type, riskLevels]
      additionalProperties: false
      properties:
        type: {type: string, enum: [overdue, rejections]}
        riskLevels:
          type: array
          items: {$ref: '#/components/schemas/RiskLevel'}
        thresholdHours: {type: integer, minimum: 1}
        thresholdCount: {type: integer, minimum: 1}
    EscalationTarget:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: {type: string, enum: [role, level_above_decider]}
        role: {$ref: '#/components/schemas/Role'}
    EscalationRule:
      allOf:
        - $ref: '#/components/schemas/ResourceMeta'
        - type: object
          required: [code, condition, target, channels, active]
          properties:
            code: {$ref: '#/components/schemas/RuleCode'}
            condition: {$ref: '#/components/schemas/EscalationCondition'}
            target: {$ref: '#/components/schemas/EscalationTarget'}
            channels:
              type: array
              items: {$ref: '#/components/schemas/Channel'}
            active: {type: boolean}
    EscalationRuleInput:
      type: object
      required: [code, condition, target, channels]
      additionalProperties: false
      properties:
        code: {$ref: '#/components/schemas/RuleCode'}
        condition: {$ref: '#/components/schemas/EscalationCondition'}
        target: {$ref: '#/components/schemas/EscalationTarget'}
        channels:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Channel'}
        active: {type: boolean, default: true}
    EscalationRuleUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        condition: {$ref: '#/components/schemas/EscalationCondition'}
        target: {$ref: '#/components/schemas/EscalationTarget'}
        channels:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Channel'}
        active: {type: boolean}
        reason: {$ref: '#/components/schemas/FreeText'}

    # ---------- demo
    DemoClock:
      type: object
      required: [v, realNow, programmeNow, offsetMs, isRealTime, demoMode]
      properties:
        v: {type: integer, minimum: 0}
        realNow: {$ref: '#/components/schemas/Timestamp'}
        programmeNow: {$ref: '#/components/schemas/Timestamp'}
        offsetMs: {type: integer, minimum: 0}
        isRealTime: {type: boolean}
        demoMode: {type: boolean}
        setBy: {$ref: '#/components/schemas/UserId'}
        setAt: {$ref: '#/components/schemas/Timestamp'}
    DemoClockSet:
      type: object
      additionalProperties: false
      description: Exactly one of `programmeNow` or `advanceBy`. Time only moves forward.
      oneOf:
        - required: [programmeNow]
        - required: [advanceBy]
      properties:
        programmeNow: {$ref: '#/components/schemas/Timestamp'}
        advanceBy: {type: string, format: duration, examples: [P7D, PT48H, P30D]}
        reason: {$ref: '#/components/schemas/FreeText'}
    SweepResult:
      type: object
      required: [runAt, programmeAt, trigger, evaluatedTasks, created, skippedDuplicates, vacantTargets]
      properties:
        runAt: {$ref: '#/components/schemas/Timestamp'}
        programmeAt: {$ref: '#/components/schemas/Timestamp'}
        trigger: {type: string, enum: [schedule, on_return, demo_run_now]}
        evaluatedTasks: {type: integer, minimum: 0}
        created:
          type: array
          items: {$ref: '#/components/schemas/Escalation'}
        skippedDuplicates: {type: integer, minimum: 0}
        vacantTargets: {type: integer, minimum: 0}

    # ---------- assessment
    Scores:
      type: object
      required: [total]
      properties:
        total: {type: number}
        max: {type: number}
        bySection:
          type: object
          additionalProperties: {type: number}
    AssessmentContext:
      allOf:
        - $ref: '#/components/schemas/ResourceMeta'
        - type: object
          required: [elevateObservationId, wardId, facilityId, cycleId, checklistVersionId, assessorUserId, assessorType, isBaselineForCycle, status, releaseState]
          properties:
            elevateObservationId: {$ref: '#/components/schemas/ElevateRef'}
            elevateSubmissionId: {$ref: '#/components/schemas/ElevateRef'}
            submissionNumber: {type: integer, minimum: 1}
            wardId: {$ref: '#/components/schemas/ObjectId'}
            facilityId: {$ref: '#/components/schemas/ObjectId'}
            cycleId: {$ref: '#/components/schemas/ObjectId'}
            checklistVersionId: {$ref: '#/components/schemas/ObjectId'}
            checklistVersion: {type: integer, minimum: 1}
            assessorUserId: {$ref: '#/components/schemas/UserId'}
            assessorType: {type: string, enum: [internal, external]}
            isBaselineForCycle: {type: boolean}
            baselineOfId: {$ref: '#/components/schemas/ObjectId'}
            declaration:
              type: object
              required: [accepted, at]
              properties:
                accepted: {type: boolean, const: true}
                at: {$ref: '#/components/schemas/Timestamp'}
            status: {$ref: '#/components/schemas/AssessmentStatus'}
            completedAt: {$ref: '#/components/schemas/Timestamp'}
            scores: {$ref: '#/components/schemas/Scores'}
            failedQuestionKeys:
              type: array
              items: {type: string, maxLength: 40}
            releaseState: {$ref: '#/components/schemas/ReleaseState'}
            releasedBy: {$ref: '#/components/schemas/UserId'}
            releasedAt: {$ref: '#/components/schemas/Timestamp'}
            evidenceIds:
              type: array
              items: {$ref: '#/components/schemas/ObjectId'}
            planOutcome:
              type: string
              description: What completion produced (US3 AS4/AS5/AS7).
              enum: [pending, draft_plan_created, no_actions_needed, same_cycle_no_plan]
            planId: {$ref: '#/components/schemas/ObjectId'}
    FormBundle:
      type: object
      required: [assessmentId, wardId, wardType, cycleId, checklistVersionId, checklistCode, version, contentHash, bundleHash, issuedAt, sections, questions]
      properties:
        assessmentId: {$ref: '#/components/schemas/ObjectId'}
        assessmentV: {type: integer, minimum: 0}
        wardId: {$ref: '#/components/schemas/ObjectId'}
        wardType: {type: string, maxLength: 32}
        cycleId: {$ref: '#/components/schemas/ObjectId'}
        checklistVersionId: {$ref: '#/components/schemas/ObjectId'}
        checklistCode: {type: string, maxLength: 32}
        version: {type: integer, minimum: 1}
        contentHash: {$ref: '#/components/schemas/Sha256'}
        bundleHash: {$ref: '#/components/schemas/Sha256'}
        graceUntil: {$ref: '#/components/schemas/Timestamp'}
        issuedAt: {$ref: '#/components/schemas/Timestamp'}
        sections:
          type: array
          description: Only sections that apply to the ward type.
          items: {$ref: '#/components/schemas/ChecklistSection'}
        questions:
          type: array
          items: {$ref: '#/components/schemas/ChecklistQuestion'}
    Answer:
      type: object
      required: [questionKey, value]
      additionalProperties: false
      properties:
        questionKey: {type: string, maxLength: 40}
        value:
          type: [number, string, boolean]
        observation: {$ref: '#/components/schemas/FreeText'}
        evidenceIds:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/ObjectId'}
    AssessmentSubmission:
      type: object
      required: [checklistVersionId, bundleHash, declaration, answers, deviceSubmittedAt]
      additionalProperties: false
      properties:
        checklistVersionId: {$ref: '#/components/schemas/ObjectId'}
        bundleHash: {$ref: '#/components/schemas/Sha256'}
        declaration:
          type: object
          required: [accepted, at]
          additionalProperties: false
          properties:
            accepted: {type: boolean, description: Must be true; false or missing → 422 DECLARATION_REQUIRED.}
            at: {$ref: '#/components/schemas/Timestamp'}
        answers:
          type: array
          minItems: 1
          maxItems: 300
          items: {$ref: '#/components/schemas/Answer'}
        notes: {$ref: '#/components/schemas/FreeText'}
        deviceId: {type: string, format: uuid}
        deviceSubmittedAt: {$ref: '#/components/schemas/Timestamp'}
    BaselineChange:
      type: object
      required: [baselineOfId, reason]
      additionalProperties: false
      properties:
        baselineOfId: {$ref: '#/components/schemas/ObjectId'}
        reason: {$ref: '#/components/schemas/FreeText'}
    AssessmentStartRequest:
      type: object
      required: [wardId, cycleId]
      additionalProperties: false
      properties:
        wardId: {$ref: '#/components/schemas/ObjectId'}
        cycleId: {$ref: '#/components/schemas/ObjectId'}
    AssessmentStartResponse:
      type: object
      required: [assessmentId, assessment, formBundle]
      properties:
        assessmentId: {$ref: '#/components/schemas/ObjectId'}
        assessment: {$ref: '#/components/schemas/AssessmentContext'}
        formBundle: {$ref: '#/components/schemas/FormBundle'}
    AssessmentContextUpsert:
      type: object
      required: [elevateObservationId, wardId, facilityId, cycleId, checklistVersionId, assessorUserId, assessorType, status]
      additionalProperties: false
      properties:
        elevateObservationId: {$ref: '#/components/schemas/ElevateRef'}
        submissionNumber: {type: integer, minimum: 1}
        wardId: {$ref: '#/components/schemas/ObjectId'}
        facilityId: {$ref: '#/components/schemas/ObjectId'}
        cycleId: {$ref: '#/components/schemas/ObjectId'}
        checklistVersionId: {$ref: '#/components/schemas/ObjectId'}
        assessorUserId: {$ref: '#/components/schemas/UserId'}
        assessorType: {type: string, enum: [internal, external]}
        declaration:
          type: object
          required: [accepted, at]
          additionalProperties: false
          properties:
            accepted: {type: boolean, const: true}
            at: {$ref: '#/components/schemas/Timestamp'}
        status: {$ref: '#/components/schemas/AssessmentStatus'}
        evidenceIds:
          type: array
          items: {$ref: '#/components/schemas/ObjectId'}
        bundleHash: {$ref: '#/components/schemas/Sha256'}
    Comparison:
      type: object
      required: [assessmentId, baselineAssessmentId, wardId, facilityId, current, baseline, sections, notComparable]
      properties:
        assessmentId: {$ref: '#/components/schemas/ObjectId'}
        baselineAssessmentId: {type: ['string', 'null'], pattern: '^[a-f0-9]{24}$', description: Null when no baseline exists.}
        wardId: {$ref: '#/components/schemas/ObjectId'}
        facilityId: {$ref: '#/components/schemas/ObjectId'}
        current:
          $ref: '#/components/schemas/ComparisonSide'
        baseline:
          $ref: '#/components/schemas/ComparisonSide'
        totalChange: {type: number}
        sections:
          type: array
          items:
            type: object
            required: [sectionKey, current, baseline, change, comparedQuestions]
            properties:
              sectionKey: {type: string, maxLength: 40}
              title: {$ref: '#/components/schemas/LocalizedText'}
              current: {type: number}
              baseline: {type: number}
              change: {type: number}
              comparedQuestions: {type: integer, minimum: 0}
        notComparable:
          type: array
          description: Questions listed under "Not comparable (version change)".
          items:
            type: object
            required: [questionKey, reason]
            properties:
              questionKey: {type: string, maxLength: 40}
              reason: {type: string, enum: [missing_in_baseline, missing_in_current, text_changed]}
    ComparisonSide:
      type: object
      required: [cycleId, checklistVersionId, checklistVersion, assessorType, total]
      properties:
        cycleId: {$ref: '#/components/schemas/ObjectId'}
        checklistVersionId: {$ref: '#/components/schemas/ObjectId'}
        checklistVersion: {type: integer, minimum: 1}
        assessorType: {type: string, enum: [internal, external]}
        completedAt: {$ref: '#/components/schemas/Timestamp'}
        total: {type: number}
    Trend:
      type: object
      required: [wardId, points]
      properties:
        wardId: {$ref: '#/components/schemas/ObjectId'}
        points:
          type: array
          items:
            type: object
            required: [cycleId, cycleCode, assessmentId, checklistVersion, total]
            properties:
              cycleId: {$ref: '#/components/schemas/ObjectId'}
              cycleCode: {type: string, maxLength: 16}
              assessmentId: {$ref: '#/components/schemas/ObjectId'}
              checklistVersion: {type: integer, minimum: 1}
              assessorType: {type: string, enum: [internal, external]}
              total: {type: number}
              bySection:
                type: object
                additionalProperties: {type: number}

    # ---------- evidence
    Gps:
      type: object
      required: [lat, lng, accuracyM]
      additionalProperties: false
      properties:
        lat: {type: number, minimum: -90, maximum: 90}
        lng: {type: number, minimum: -180, maximum: 180}
        accuracyM: {type: number, minimum: 0}
    EvidenceMime:
      type: string
      enum: [image/jpeg, image/png, application/pdf]
    EvidenceLink:
      type: object
      required: [type, id]
      additionalProperties: false
      properties:
        type: {type: string, enum: [task, question]}
        id: {type: string, maxLength: 64, description: "Task id, or `<assessmentId>:<questionKey>`."}
    EvidenceItem:
      allOf:
        - $ref: '#/components/schemas/ResourceMeta'
        - type: object
          required: [sha256, sizeBytes, mime, capturedAt, gps, gpsUnavailable, uploadedBy, facilityId, wardId, link, state]
          properties:
            sha256: {$ref: '#/components/schemas/Sha256'}
            sizeBytes: {type: integer, minimum: 1, maximum: 10485760}
            mime: {$ref: '#/components/schemas/EvidenceMime'}
            capturedAt: {$ref: '#/components/schemas/Timestamp'}
            receivedAt: {$ref: '#/components/schemas/Timestamp'}
            clockSkewSec: {type: integer}
            gps:
              oneOf:
                - $ref: '#/components/schemas/Gps'
                - type: 'null'
            gpsUnavailable: {type: boolean}
            uploadedBy: {$ref: '#/components/schemas/UserId'}
            facilityId: {$ref: '#/components/schemas/ObjectId'}
            wardId: {$ref: '#/components/schemas/ObjectId'}
            link: {$ref: '#/components/schemas/EvidenceLink'}
            state: {type: string, enum: [intent, uploaded, confirmed, rejected, deleted_patient_data]}
            deletedAt: {$ref: '#/components/schemas/Timestamp'}
            deletedBy: {$ref: '#/components/schemas/UserId'}
    EvidenceIntentRequest:
      type: object
      required: [sha256, sizeBytes, mime, capturedAt, gps, gpsUnavailable, wardId, link, deviceId]
      additionalProperties: false
      properties:
        sha256: {$ref: '#/components/schemas/Sha256'}
        sizeBytes: {type: integer, minimum: 1, maximum: 10485760}
        mime: {$ref: '#/components/schemas/EvidenceMime'}
        capturedAt: {$ref: '#/components/schemas/Timestamp'}
        gps:
          oneOf:
            - $ref: '#/components/schemas/Gps'
            - type: 'null'
        gpsUnavailable: {type: boolean}
        wardId: {$ref: '#/components/schemas/ObjectId'}
        link: {$ref: '#/components/schemas/EvidenceLink'}
        deviceId: {type: string, format: uuid}
    SignedUrl:
      type: object
      required: [url, method, expiresAt]
      properties:
        url: {type: string, format: uri}
        method: {type: string, enum: [GET, PUT]}
        headers:
          type: object
          description: Headers the client must send with the PUT (e.g. Content-Type, x-amz-checksum-sha256).
          additionalProperties: {type: string}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
        ttlSec: {type: integer, minimum: 1, maximum: 300}
    EvidenceIntentResponse:
      type: object
      required: [evidence, upload]
      properties:
        evidence: {$ref: '#/components/schemas/EvidenceItem'}
        upload: {$ref: '#/components/schemas/SignedUrl'}
        alreadyUploaded: {type: boolean, description: True when an item with this sha256 and link already exists.}
    PatientDataDeletion:
      type: object
      required: [reasonCode]
      additionalProperties: false
      properties:
        reasonCode: {type: string, const: PATIENT_DATA_VISIBLE}
        reasonText: {$ref: '#/components/schemas/FreeText'}

    # ---------- plans & tasks
    Goal:
      type: object
      required: [key, text]
      additionalProperties: false
      properties:
        key: {type: string, maxLength: 40}
        text: {$ref: '#/components/schemas/FreeText'}
    Milestone:
      type: object
      required: [key, text, dueAt]
      additionalProperties: false
      properties:
        key: {type: string, maxLength: 40}
        text: {$ref: '#/components/schemas/FreeText'}
        dueAt: {$ref: '#/components/schemas/Timestamp'}
    Plan:
      allOf:
        - $ref: '#/components/schemas/ResourceMeta'
        - type: object
          required: [wardId, facilityId, cycleId, sourceAssessmentId, status, planTemplateVersion, revision]
          properties:
            wardId: {$ref: '#/components/schemas/ObjectId'}
            facilityId: {$ref: '#/components/schemas/ObjectId'}
            cycleId: {$ref: '#/components/schemas/ObjectId'}
            sourceAssessmentId: {$ref: '#/components/schemas/ObjectId'}
            status: {$ref: '#/components/schemas/PlanStatus'}
            elevateProjectId: {$ref: '#/components/schemas/ElevateRef'}
            planTemplateVersion: {type: integer, minimum: 1}
            revision: {type: integer, minimum: 0}
            goals:
              type: array
              items: {$ref: '#/components/schemas/Goal'}
            milestones:
              type: array
              items: {$ref: '#/components/schemas/Milestone'}
            carriedOverTaskIds:
              type: array
              items: {$ref: '#/components/schemas/ObjectId'}
            approvedBy: {$ref: '#/components/schemas/UserId'}
            approvedAt: {$ref: '#/components/schemas/Timestamp'}
            draftCreatedAt: {$ref: '#/components/schemas/Timestamp'}
            taskCounts:
              type: object
              additionalProperties: {type: integer, minimum: 0}
    DraftTask:
      type: object
      required: [taskKey, title, riskLevel, dueAt, evidenceRule, secondValidation, included]
      properties:
        taskKey: {type: string, maxLength: 40}
        title: {$ref: '#/components/schemas/LocalizedText'}
        sourceQuestionKey: {type: string, maxLength: 40}
        riskLevel: {$ref: '#/components/schemas/RiskLevel'}
        ownerUserId: {$ref: '#/components/schemas/UserId'}
        dueAt: {$ref: '#/components/schemas/Timestamp'}
        dependsOnTaskKeys:
          type: array
          items: {type: string, maxLength: 40}
        evidenceRule: {$ref: '#/components/schemas/EvidenceRule'}
        secondValidation: {type: boolean}
        included: {type: boolean}
    PlanDetail:
      allOf:
        - $ref: '#/components/schemas/Plan'
        - type: object
          properties:
            draftTasks:
              type: array
              description: Present while status is draft.
              items: {$ref: '#/components/schemas/DraftTask'}
            tasks:
              type: array
              description: Present once active (includes carried-over tasks by link).
              items: {$ref: '#/components/schemas/Task'}
            unplannedFindings:
              type: array
              description: Failed questions from later same-cycle assessments the officer may add by revision (US3 AS7).
              items:
                type: object
                required: [assessmentId, questionKey, riskLevel]
                properties:
                  assessmentId: {$ref: '#/components/schemas/ObjectId'}
                  questionKey: {type: string, maxLength: 40}
                  riskLevel: {$ref: '#/components/schemas/RiskLevel'}
    DraftPlanUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        goals:
          type: array
          items: {$ref: '#/components/schemas/Goal'}
        milestones:
          type: array
          items: {$ref: '#/components/schemas/Milestone'}
        tasks:
          type: array
          items:
            type: object
            required: [taskKey]
            additionalProperties: false
            properties:
              taskKey: {type: string, maxLength: 40}
              ownerUserId: {$ref: '#/components/schemas/UserId'}
              dueAt: {$ref: '#/components/schemas/Timestamp'}
              dependsOnTaskKeys:
                type: array
                items: {type: string, maxLength: 40}
              included: {type: boolean}
    NewTaskInput:
      type: object
      required: [title, riskLevel, ownerUserId]
      additionalProperties: false
      properties:
        title: {$ref: '#/components/schemas/LocalizedText'}
        sourceQuestionKey: {type: string, maxLength: 40}
        riskLevel: {$ref: '#/components/schemas/RiskLevel'}
        ownerUserId: {$ref: '#/components/schemas/UserId'}
        dueAt: {$ref: '#/components/schemas/Timestamp'}
        dependsOnTaskIds:
          type: array
          items: {$ref: '#/components/schemas/ObjectId'}
    PlanChange:
      type: object
      required: [op]
      additionalProperties: false
      properties:
        op: {type: string, enum: [add, remove, update]}
        taskId: {$ref: '#/components/schemas/ObjectId'}
        task: {$ref: '#/components/schemas/NewTaskInput'}
        set:
          type: object
          additionalProperties: false
          properties:
            title: {$ref: '#/components/schemas/LocalizedText'}
            dueAt: {$ref: '#/components/schemas/Timestamp'}
            dependsOnTaskIds:
              type: array
              items: {$ref: '#/components/schemas/ObjectId'}
      description: add needs `task`; remove needs `taskId`; update needs `taskId` and `set`.
    PlanRevisionRequest:
      type: object
      required: [reason, changes]
      additionalProperties: false
      properties:
        reason: {$ref: '#/components/schemas/FreeText'}
        changes:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/PlanChange'}
    PlanRevision:
      allOf:
        - $ref: '#/components/schemas/ResourceMeta'
        - type: object
          required: [planId, revision, actorUserId, role, reason, changes, source]
          properties:
            planId: {$ref: '#/components/schemas/ObjectId'}
            revision: {type: integer, minimum: 1}
            actorUserId: {$ref: '#/components/schemas/UserId'}
            role: {$ref: '#/components/schemas/Role'}
            reason: {$ref: '#/components/schemas/FreeText'}
            source: {type: string, enum: [officer, mentor_outcome, carry_over]}
            supportRequestId: {$ref: '#/components/schemas/ObjectId'}
            changes:
              type: array
              items:
                type: object
                required: [op, taskId]
                properties:
                  op: {type: string, enum: [add, remove, update]}
                  taskId: {$ref: '#/components/schemas/ObjectId'}
                  before: {type: object}
                  after: {type: object}
    BlockedFlag:
      type: object
      required: [reason, by, at]
      properties:
        reason: {$ref: '#/components/schemas/FreeText'}
        by: {$ref: '#/components/schemas/UserId'}
        at: {$ref: '#/components/schemas/Timestamp'}
    Task:
      allOf:
        - $ref: '#/components/schemas/ResourceMeta'
        - type: object
          required: [planId, wardId, taskKey, title, riskLevel, ownerUserId, dueAt, dependsOnTaskIds, evidenceRule, secondValidation, state, rejectionCount, syncState]
          properties:
            planId: {$ref: '#/components/schemas/ObjectId'}
            wardId: {$ref: '#/components/schemas/ObjectId'}
            taskKey: {type: string, maxLength: 40}
            title: {$ref: '#/components/schemas/LocalizedText'}
            sourceQuestionKey: {type: string, maxLength: 40}
            riskLevel: {$ref: '#/components/schemas/RiskLevel'}
            ownerUserId: {$ref: '#/components/schemas/UserId'}
            dueAt: {$ref: '#/components/schemas/Timestamp'}
            overdue: {type: boolean, description: Computed against programme time.}
            dependsOnTaskIds:
              type: array
              items: {$ref: '#/components/schemas/ObjectId'}
            evidenceRule: {$ref: '#/components/schemas/EvidenceRule'}
            secondValidation: {type: boolean}
            state: {$ref: '#/components/schemas/TaskState'}
            rejectionCount: {type: integer, minimum: 0}
            blocked:
              oneOf:
                - $ref: '#/components/schemas/BlockedFlag'
                - type: 'null'
            lastReturnReason:
              type: object
              properties:
                reasonCode: {$ref: '#/components/schemas/DecisionReasonCode'}
                reasonText: {$ref: '#/components/schemas/FreeText'}
            supportRequestId: {$ref: '#/components/schemas/ObjectId'}
            carriedOverFromTaskId: {$ref: '#/components/schemas/ObjectId'}
            reopenedFromTaskId: {$ref: '#/components/schemas/ObjectId'}
            elevateTaskId: {$ref: '#/components/schemas/ElevateRef'}
            currentEvidenceIds:
              type: array
              items: {$ref: '#/components/schemas/ObjectId'}
            syncState: {type: string, enum: [in_sync, pending, diverged]}
            needsReassignment: {type: boolean, description: Owner left or lost scope.}
    EvidenceSubmission:
      type: object
      required: [evidenceIds]
      additionalProperties: false
      properties:
        evidenceIds:
          type: array
          minItems: 0
          maxItems: 10
          items: {$ref: '#/components/schemas/ObjectId'}
        note: {$ref: '#/components/schemas/FreeText'}
    AcceptDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        reasonCode: {$ref: '#/components/schemas/DecisionReasonCode'}
        reasonText: {$ref: '#/components/schemas/FreeText'}
    ReasonedDecisionRequest:
      type: object
      required: [reasonCode]
      additionalProperties: false
      properties:
        reasonCode: {$ref: '#/components/schemas/DecisionReasonCode'}
        reasonText: {$ref: '#/components/schemas/FreeText'}
    ReassignRequest:
      type: object
      required: [newOwnerUserId, reason]
      additionalProperties: false
      properties:
        newOwnerUserId: {$ref: '#/components/schemas/UserId'}
        reason: {$ref: '#/components/schemas/FreeText'}
    BlockedFlagRequest:
      type: object
      required: [blocked]
      additionalProperties: false
      properties:
        blocked: {type: boolean}
        reason: {$ref: '#/components/schemas/FreeText'}
    ReopenRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: {$ref: '#/components/schemas/FreeText'}
        ownerUserId: {$ref: '#/components/schemas/UserId'}
        dueAt: {$ref: '#/components/schemas/Timestamp'}
    Decision:
      allOf:
        - $ref: '#/components/schemas/ResourceMeta'
        - type: object
          required: [taskId, kind, actorUserId, role, evidenceIds, evidenceHashes, at]
          properties:
            taskId: {$ref: '#/components/schemas/ObjectId'}
            kind: {$ref: '#/components/schemas/DecisionKind'}
            actorUserId: {$ref: '#/components/schemas/UserId'}
            role: {$ref: '#/components/schemas/Role'}
            reasonCode: {$ref: '#/components/schemas/DecisionReasonCode'}
            reasonText: {$ref: '#/components/schemas/FreeText'}
            evidenceIds:
              type: array
              items: {$ref: '#/components/schemas/ObjectId'}
            evidenceHashes:
              type: array
              items: {$ref: '#/components/schemas/Sha256'}
            at: {$ref: '#/components/schemas/Timestamp'}
    TaskHistoryEntry:
      type: object
      required: [at, programmeAt, actor, action, ledgerSeq]
      properties:
        at: {$ref: '#/components/schemas/Timestamp'}
        programmeAt: {$ref: '#/components/schemas/Timestamp'}
        actor: {$ref: '#/components/schemas/Actor'}
        action: {type: string, maxLength: 64, examples: [task.started, task.returned, task.validated, task.reassigned, task.escalated]}
        fromState: {$ref: '#/components/schemas/TaskState'}
        toState: {$ref: '#/components/schemas/TaskState'}
        reasonCode: {$ref: '#/components/schemas/DecisionReasonCode'}
        reason: {$ref: '#/components/schemas/FreeText'}
        evidenceHashes:
          type: array
          items: {$ref: '#/components/schemas/Sha256'}
        previousOwnerUserId: {$ref: '#/components/schemas/UserId'}
        newOwnerUserId: {$ref: '#/components/schemas/UserId'}
        escalationId: {$ref: '#/components/schemas/ObjectId'}
        ledgerSeq: {type: integer, minimum: 1}
        ledgerHash: {$ref: '#/components/schemas/Sha256'}
    TaskHistory:
      type: object
      required: [task, entries, decisions, escalations]
      properties:
        task: {$ref: '#/components/schemas/Task'}
        entries:
          type: array
          items: {$ref: '#/components/schemas/TaskHistoryEntry'}
        decisions:
          type: array
          items: {$ref: '#/components/schemas/Decision'}
        escalations:
          type: array
          items: {$ref: '#/components/schemas/Escalation'}

    # ---------- escalation & notification
    Escalation:
      allOf:
        - $ref: '#/components/schemas/ResourceMeta'
        - type: object
          required: [taskId, ruleCode, level, targetRole, targetUserIds, raisedAt, raisedBy, vacantTargetFlag]
          properties:
            taskId: {$ref: '#/components/schemas/ObjectId'}
            ruleCode:
              type: string
              pattern: '^(R[0-9]{1,3}|manual)$'
            level: {type: integer, minimum: 1, maximum: 3}
            targetRole: {$ref: '#/components/schemas/Role'}
            targetUserIds:
              type: array
              items: {$ref: '#/components/schemas/UserId'}
            raisedAt: {$ref: '#/components/schemas/Timestamp'}
            programmeAt: {$ref: '#/components/schemas/Timestamp'}
            raisedBy: {type: string, maxLength: 64, description: '`system` or a user id.'}
            reason: {$ref: '#/components/schemas/FreeText'}
            notificationIds:
              type: array
              items: {$ref: '#/components/schemas/ObjectId'}
            vacantTargetFlag: {type: boolean}
    ManualEscalationRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: {$ref: '#/components/schemas/FreeText'}
    Notification:
      allOf:
        - $ref: '#/components/schemas/ResourceMeta'
        - type: object
          required: [userId, channel, templateCode, params, status]
          properties:
            userId: {$ref: '#/components/schemas/UserId'}
            channel: {$ref: '#/components/schemas/Channel'}
            templateCode: {type: string, maxLength: 64}
            params:
              type: object
              description: Template parameters (ids, titles, dates). Never patient data.
              additionalProperties:
                type: [string, number, boolean]
            consent:
              $ref: '#/components/schemas/SmsConsent'
            sentAt: {$ref: '#/components/schemas/Timestamp'}
            status: {type: string, enum: [queued, sent, delivered, failed, read]}
            providerMessageId: {type: string, maxLength: 128}
            readAt: {$ref: '#/components/schemas/Timestamp'}
            subject:
              type: object
              properties:
                type: {$ref: '#/components/schemas/LedgerSubjectType'}
                id: {type: string, maxLength: 64}

    # ---------- support
    ShortlistEntry:
      type: object
      required: [mentorId, rank, skillMatch, languageMatch, available]
      properties:
        mentorId: {$ref: '#/components/schemas/ElevateRef'}
        name: {type: string, maxLength: 200}
        rank: {type: integer, minimum: 1}
        skillMatch: {type: boolean}
        languageMatch: {type: boolean}
        available: {type: boolean, description: At least one open slot in the next 14 days of programme time.}
        nextOpenSlotAt: {$ref: '#/components/schemas/Timestamp'}
        skills:
          type: array
          items: {$ref: '#/components/schemas/Skill'}
        languages:
          type: array
          items: {$ref: '#/components/schemas/Language'}
    AgreedAction:
      type: object
      required: [text]
      properties:
        text: {$ref: '#/components/schemas/FreeText'}
        proposedOwnerUserId: {$ref: '#/components/schemas/UserId'}
        taskId: {$ref: '#/components/schemas/ObjectId'}
    SupportRequest:
      allOf:
        - $ref: '#/components/schemas/ResourceMeta'
        - type: object
          required: [wardId, facilityId, raisedBy, problem, skill, language, shortlist, status]
          properties:
            wardId: {$ref: '#/components/schemas/ObjectId'}
            facilityId: {$ref: '#/components/schemas/ObjectId'}
            raisedBy: {$ref: '#/components/schemas/UserId'}
            problem: {$ref: '#/components/schemas/FreeText'}
            skill: {$ref: '#/components/schemas/Skill'}
            language: {$ref: '#/components/schemas/Language'}
            shortlist:
              type: array
              items: {$ref: '#/components/schemas/ShortlistEntry'}
            chosenMentorId: {$ref: '#/components/schemas/ElevateRef'}
            elevateRequestSessionId: {$ref: '#/components/schemas/ElevateRef'}
            status: {$ref: '#/components/schemas/SupportRequestStatus'}
            heldAt: {$ref: '#/components/schemas/Timestamp'}
            agreedActions:
              type: array
              items: {$ref: '#/components/schemas/AgreedAction'}
            planRevision: {type: integer, minimum: 1}
    SupportRequestCreate:
      type: object
      required: [wardId, problem, skill, language]
      additionalProperties: false
      properties:
        wardId: {$ref: '#/components/schemas/ObjectId'}
        problem: {$ref: '#/components/schemas/FreeText'}
        skill: {$ref: '#/components/schemas/Skill'}
        language: {$ref: '#/components/schemas/Language'}
    SessionRequestCreate:
      type: object
      required: [mentorId]
      additionalProperties: false
      properties:
        mentorId: {$ref: '#/components/schemas/ElevateRef'}
        message: {$ref: '#/components/schemas/FreeText'}
        proposedStartAt: {$ref: '#/components/schemas/Timestamp'}
    SupportOutcome:
      type: object
      required: [held, heldAt, agreedActions]
      additionalProperties: false
      properties:
        held: {type: boolean, const: true}
        heldAt: {$ref: '#/components/schemas/Timestamp'}
        agreedActions:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [text]
            additionalProperties: false
            properties:
              text: {$ref: '#/components/schemas/FreeText'}
    AgreedActionsToPlan:
      type: object
      required: [actions]
      additionalProperties: false
      properties:
        reason: {$ref: '#/components/schemas/FreeText'}
        actions:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [index, ownerUserId, riskLevel]
            additionalProperties: false
            properties:
              index: {type: integer, minimum: 0, description: Index into the request's agreedActions.}
              ownerUserId: {$ref: '#/components/schemas/UserId'}
              riskLevel: {$ref: '#/components/schemas/RiskLevel'}
              dueAt: {$ref: '#/components/schemas/Timestamp'}

    # ---------- oversight
    OversightCounts:
      type: object
      required: [wards, wardsAssessed, completionRate, openCriticalTasks, overdueCriticalTasks, repeatedFailures, dataQualityExceptions]
      properties:
        wards: {type: integer, minimum: 0}
        wardsAssessed: {type: integer, minimum: 0}
        completionRate: {type: number, minimum: 0, maximum: 1}
        openCriticalTasks: {type: integer, minimum: 0}
        overdueCriticalTasks: {type: integer, minimum: 0}
        repeatedFailures: {type: integer, minimum: 0, description: Tasks with rejectionCount ≥ 2 plus questions failed in 2 consecutive cycles.}
        dataQualityExceptions: {type: integer, minimum: 0}
        averageScore: {type: number}
    OversightSummary:
      type: object
      required: [scope, programmeAt, cycleId, totals, byDistrict, byFacility]
      properties:
        scope: {$ref: '#/components/schemas/Scope'}
        programmeAt: {$ref: '#/components/schemas/Timestamp'}
        cycleId: {$ref: '#/components/schemas/ObjectId'}
        totals: {$ref: '#/components/schemas/OversightCounts'}
        byDistrict:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/OversightCounts'
              - type: object
                required: [districtCode]
                properties:
                  districtCode: {type: string, maxLength: 32}
        byFacility:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/OversightCounts'
              - type: object
                required: [facilityId, name]
                properties:
                  facilityId: {$ref: '#/components/schemas/ObjectId'}
                  name: {type: string, maxLength: 200}
        trend:
          type: array
          items:
            type: object
            required: [cycleCode, averageScore]
            properties:
              cycleCode: {type: string, maxLength: 16}
              averageScore: {type: number}
    OversightWardRow:
      type: object
      required: [wardId, wardName, facilityId, facilityName, districtCode, assessmentStatus, openCriticalTasks, overdueCriticalTasks, repeatedFailures]
      properties:
        wardId: {$ref: '#/components/schemas/ObjectId'}
        wardName: {type: string, maxLength: 200}
        wardType: {type: string, maxLength: 32}
        facilityId: {$ref: '#/components/schemas/ObjectId'}
        facilityName: {type: string, maxLength: 200}
        districtCode: {type: string, maxLength: 32}
        assessmentStatus: {type: string, enum: [not_started, submitted, completed, held]}
        latestScore: {type: number}
        baselineScore: {type: number}
        openCriticalTasks: {type: integer, minimum: 0}
        overdueCriticalTasks: {type: integer, minimum: 0}
        repeatedFailures: {type: integer, minimum: 0}
        dataQualityExceptions: {type: integer, minimum: 0}
    DataQualityException:
      type: object
      required: [id, kind, detectedAt, facilityId]
      properties:
        id: {type: string, maxLength: 64}
        kind: {$ref: '#/components/schemas/DataQualityExceptionKind'}
        detectedAt: {$ref: '#/components/schemas/Timestamp'}
        facilityId: {$ref: '#/components/schemas/ObjectId'}
        wardId: {$ref: '#/components/schemas/ObjectId'}
        evidenceId: {$ref: '#/components/schemas/ObjectId'}
        relatedEvidenceIds:
          type: array
          items: {$ref: '#/components/schemas/ObjectId'}
        userId: {$ref: '#/components/schemas/UserId'}
        deviceId: {type: string, format: uuid}
        cycleId: {$ref: '#/components/schemas/ObjectId'}
        metric:
          type: object
          description: Kind-specific value, e.g. distanceM, skewSec, uploadDelayHours, oldestPendingHours.
          additionalProperties: {type: number}

    # ---------- devices
    DeviceQueueStatusReport:
      type: object
      required: [oldestPendingAt, pendingCount, failedCount, reportedAt]
      additionalProperties: false
      properties:
        oldestPendingAt:
          type: ['string', 'null']
          format: date-time
        pendingCount: {type: integer, minimum: 0}
        failedCount: {type: integer, minimum: 0}
        reportedAt: {$ref: '#/components/schemas/Timestamp'}
        appVersion: {type: string, maxLength: 32}
    DeviceQueueStatus:
      type: object
      required: [deviceId, userId, pendingCount, failedCount, reportedAt, receivedAt]
      properties:
        deviceId: {type: string, format: uuid}
        userId: {$ref: '#/components/schemas/UserId'}
        oldestPendingAt:
          type: ['string', 'null']
          format: date-time
        pendingCount: {type: integer, minimum: 0}
        failedCount: {type: integer, minimum: 0}
        reportedAt: {$ref: '#/components/schemas/Timestamp'}
        receivedAt: {$ref: '#/components/schemas/Timestamp'}

    # ---------- ledger
    LedgerRecord:
      type: object
      required: [seq, at, programmeAt, actor, action, subject, correlationId, prevHash, hash]
      properties:
        seq: {type: integer, minimum: 1}
        at: {$ref: '#/components/schemas/Timestamp'}
        programmeAt: {$ref: '#/components/schemas/Timestamp'}
        actor: {$ref: '#/components/schemas/Actor'}
        action: {type: string, maxLength: 64, examples: [task.returned, checklist.published, scope.changed, evidence.denied, reconcile.corrected, clock.shifted]}
        subject:
          type: object
          required: [type, id]
          properties:
            type: {$ref: '#/components/schemas/LedgerSubjectType'}
            id: {type: string, maxLength: 64}
        reason: {$ref: '#/components/schemas/FreeText'}
        beforeHash: {$ref: '#/components/schemas/Sha256'}
        afterHash: {$ref: '#/components/schemas/Sha256'}
        correlationId: {type: string, maxLength: 64}
        prevHash: {$ref: '#/components/schemas/Sha256'}
        hash: {$ref: '#/components/schemas/Sha256'}
    LedgerAppendRequest:
      type: object
      required: [actor, action, subject, correlationId]
      additionalProperties: false
      properties:
        actor: {$ref: '#/components/schemas/Actor'}
        action: {type: string, pattern: '^[a-z_]+\.[a-z_]+$', maxLength: 64, examples: [evidence.denied, scope.denied, checklist.edit_refused]}
        subject:
          type: object
          required: [type, id]
          additionalProperties: false
          properties:
            type: {$ref: '#/components/schemas/LedgerSubjectType'}
            id: {type: string, maxLength: 64}
        reason: {$ref: '#/components/schemas/FreeText'}
        beforeHash: {$ref: '#/components/schemas/Sha256'}
        afterHash: {$ref: '#/components/schemas/Sha256'}
        correlationId: {type: string, minLength: 1, maxLength: 64}
    LedgerVerification:
      type: object
      required: [ok, checkedRecords, verifiedAt]
      properties:
        ok: {type: boolean}
        checkedRecords: {type: integer, minimum: 0}
        fromSeq: {type: integer, minimum: 1}
        lastSeq: {type: integer, minimum: 0}
        firstBrokenSeq: {type: ['integer', 'null'], minimum: 1}
        verifiedAt: {$ref: '#/components/schemas/Timestamp'}

    # ---------- health / internal
    Health:
      type: object
      required: [status, service, version]
      properties:
        status: {type: string, enum: [ok, degraded, down]}
        service: {type: string, enum: [edge, workflow, adapters]}
        version: {type: string, maxLength: 32}
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, down]
    DependencyReport:
      type: object
      required: [checkedAt, dependencies]
      properties:
        checkedAt: {$ref: '#/components/schemas/Timestamp'}
        dependencies:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name:
                type: string
                enum: [elevate-user, elevate-entity, elevate-samiksha, elevate-project, elevate-mentoring, elevate-scheduler, elevate-notification, kafka, mongo, minio, workflow, adapters]
              status: {type: string, enum: [up, degraded, down]}
              circuit: {type: string, enum: [closed, open, half_open]}
              latencyMs: {type: number, minimum: 0}
              affects:
                type: array
                description: User-facing functions affected when down.
                items: {type: string, maxLength: 64}
    ReconciliationResult:
      type: object
      required: [runAt, plansChecked, tasksChecked, corrections, failures]
      properties:
        runAt: {$ref: '#/components/schemas/Timestamp'}
        plansChecked: {type: integer, minimum: 0}
        tasksChecked: {type: integer, minimum: 0}
        corrections: {type: integer, minimum: 0}
        failures: {type: integer, minimum: 0}
