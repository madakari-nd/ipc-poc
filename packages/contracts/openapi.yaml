  /ipc/v1/assessments:
    get:
      tags: [assessments]
      operationId: listAssessments
      summary: Assessments in scope; view=assigned lists the wards the caller must assess
      description: Held external results (`releaseState=held`) are omitted for hospital users until released (FR-024a).
      x-roles: [STATE_ADMIN, DISTRICT_QM, IPC_OFFICER, WARD_SUPERVISOR, EXTERNAL_AUDITOR]
      x-requirements: [FR-007, FR-010, FR-024a, FR-028, US2, US7, US9]
      parameters:
        - name: view
          in: query
          schema: {type: string, enum: [assigned, all], default: all}
        - {name: wardId, in: query, schema: {$ref: '#/components/schemas/ObjectId'}}
        - {name: cycleId, in: query, schema: {$ref: '#/components/schemas/ObjectId'}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/AssessmentStatus'}}
        - {name: releaseState, in: query, schema: {$ref: '#/components/schemas/ReleaseState'}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Assessments.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/AssessmentContext'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      tags: [assessments]
      operationId: startAssessment
      summary: Start an assessment of a ward for a cycle and get its offline form bundle
      description: |
        Called by the field app while online, when downloading a ward for offline use. Creates the
        ELEVATE samiksha observation for the ward (`data.entities` = the ward's ELEVATE entity) on the
        cycle's observation solution and the programme AssessmentContext (status `draft`), and returns
        the `assessmentId` with the form bundle (checklist version and content hash). Repeating the
        call for the same caller, ward and cycle while a draft is open returns that draft (200). Ward
        outside scope → 403 `SCOPE_DENIED`; caller not assigned to assess the ward → 403 `NOT_OWNER`.
      security:
        - sessionCookie: []
          csrfToken: []
      x-roles: [IPC_OFFICER, EXTERNAL_AUDITOR]
      x-requirements: [FR-007, FR-010, US2]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssessmentStartRequest'}
      responses:
        '200':
          description: An open draft already exists; returned with its bundle.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssessmentStartResponse'}
        '201':
          description: Assessment started.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssessmentStartResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
