      tags: [assessments]
      operationId: getAssessment
      summary: One assessment with scores, version, baseline link and declaration
      x-roles: [STATE_ADMIN, DISTRICT_QM, IPC_OFFICER, WARD_SUPERVISOR, EXTERNAL_AUDITOR]
